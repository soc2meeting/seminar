<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作人員專屬 - 報到台儀表板</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary: #0284c7; --success: #166534; --warning: #ea580c; --danger: #dc2626; --bg: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, '微軟正黑體', sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: #334155; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* 登入畫面 */
        #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .login-box input { font-size: 24px; padding: 10px; width: 200px; text-align: center; letter-spacing: 5px; margin: 20px 0; border: 2px solid #cbd5e1; border-radius: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; font-size: 1.1em; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        /* 儀表板主畫面 */
        #dashboard { display: none; }
        .header-stats { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .stat-box { text-align: center; }
        .stat-num { font-size: 2em; font-weight: bold; color: var(--primary); }
        .logout-btn { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em; font-weight: bold; transition: 0.2s; }
        .logout-btn:hover { background: #e2e8f0; }

        .action-panel { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .scanner-card { flex: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; min-width: 300px; }
        .search-card { flex: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-width: 300px; }
        
        input.search-input { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; }
        
        #gunInput { opacity: 0; position: absolute; top: -9999px; }
        .scanner-status { display: inline-block; padding: 8px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; }
        .status-ready { background: #dcfce7; color: var(--success); }
        .status-wait { background: #fee2e2; color: var(--danger); }

        /* 名單表格與頁籤 */
        .tab-group { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; justify-content: space-between; }
        .tab-buttons { display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; border: 2px solid var(--primary); background: white; color: var(--primary); border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1em; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }

        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-x: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        th { background: var(--primary); color: white; padding: 15px; white-space: nowrap; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; transition: color 0.3s; }
        tr:hover { background-color: #f8fafc; }
        .badge-success { background: #dcfce7; color: var(--success); padding: 4px 8px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        
        /* 💡 1. 成功報到後的整列閃爍動畫 */
        @keyframes flashRowAnim {
            0%, 50%, 100% { background-color: transparent; }
            25%, 75% { background-color: #fef08a; } /* 黃底閃爍 */
        }
        .flash-row { animation: flashRowAnim 2s ease-in-out; }
        .flash-row td, .flash-row td strong, .flash-row td span {
            color: #b45309 !important; /* 文字轉為顯眼橘色 */
        }

        /* 💡 2. 重複報到的 Icon 警告動畫 */
        @keyframes warningPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #dc2626; }
            100% { transform: scale(1); }
        }
        .icon-warning-blink { animation: warningPulse 0.8s infinite; }

        /* 動態按鈕樣式 */
        .btn-checkin-manual { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em; font-weight: bold; transition: 0.2s; }
        .btn-checkin-manual:hover { background: #0369a1; }
        .meal-toggle { cursor: pointer; padding: 4px 8px; border-radius: 4px; border: 1px solid #cbd5e1; background: white; font-size: 0.9em; transition: 0.2s; }
        .meal-active { background: var(--warning); color: white; border-color: var(--warning); font-weight: bold; }

        /* 彈窗按鈕顏色變化 */
        .btn-danger-modal { background: #dc2626 !important; }
        .btn-danger-modal:hover { background: #b91c1c !important; }
        .btn-primary-modal { background: var(--primary) !important; }

        /* 彈出視窗共用樣式 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; max-width: 450px; width: 90%; }
        .modal-box h2 { font-size: 2.2em; margin-top: 0; margin-bottom: 10px; }
        .modal-info { background: #f8fafc; padding: 20px; border-radius: 8px; text-align: left; font-size: 1.2em; line-height: 1.6; margin: 20px 0; border: 1px solid #e2e8f0; }
        .modal-info strong { color: #64748b; }
        .btn-large { width: 100%; padding: 15px; font-size: 1.2em; }
    </style>
</head>
<body>

    <!-- 登入畫面 -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 style="color: #0284c7; margin-top: 0;">🛡️ 報到台驗證</h2>
            <p>請輸入工作人員通行碼以解鎖名單</p>
            <input type="password" id="passcodeInput" placeholder="****" maxlength="4" autofocus>
            <br>
            <button class="btn" id="loginBtn" onclick="login()">解鎖進入</button>
        </div>
    </div>

    <!-- 儀表板畫面 -->
    <div id="dashboard" class="container">
        
        <div class="header-stats">
            <div>
                <h2 style="margin: 0; color: var(--primary);">📋 EEW 交流會報到台</h2>
                <div style="margin-top: 10px;">
                    <button class="logout-btn" onclick="logout()">登出系統</button>
                </div>
            </div>
            <div style="display: flex; gap: 30px;">
                <div class="stat-box">
                    <div style="font-size: 0.9em; color: #64748b;">總報名</div>
                    <div class="stat-num" id="totalCount">0</div>
                </div>
                <div class="stat-box">
                    <div style="font-size: 0.9em; color: #64748b;">已報到</div>
                    <div class="stat-num" id="checkinCount" style="color: var(--success);">0</div>
                </div>
            </div>
        </div>

        <div class="action-panel">
            <!-- 掃描區 -->
            <div class="scanner-card" id="scannerArea">
                <h3 style="margin-top: 0;">📷 條碼掃描區</h3>
                <!-- 狀態指示燈 -->
                <div id="gunStatus" class="scanner-status status-ready">🟢 實體掃描槍：已就緒</div>
                <p style="font-size: 0.9em; color: #64748b;">(點擊畫面任意處即可恢復焦點)</p>
                
                <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 15px 0;">
                
                <!-- 鏡頭控制按鈕 -->
                <button class="btn" id="cameraBtn" onclick="startCamera()" style="background: #475569; width: 100%;">📷 開啟手機鏡頭掃描</button>
                <button class="btn" id="stopCameraBtn" onclick="stopCamera()" style="background: #dc2626; width: 100%; display: none;">❌ 關閉手機鏡頭</button>
                
                <div id="reader" style="width: 100%; margin-top: 15px; display: none; overflow: hidden; border-radius: 8px;"></div>
                
                <!-- 隱藏的實體掃描槍接收框 -->
                <input type="text" id="gunInput" autocomplete="off" inputmode="none">
            </div>

            <!-- 手動搜尋區 -->
            <div class="search-card">
                <h3 style="margin-top: 0;">🔍 手動搜尋報到</h3>
                <p style="font-size: 0.9em; color: #64748b;">忘記帶手機？請輸入姓名或電話：</p>
                <input type="text" id="searchInput" class="search-input" placeholder="例如：王小明 或 0912..." onkeyup="filterList()">
            </div>
        </div>

        <!-- 名單區 -->
        <div class="table-container">
            <div class="tab-group">
                <div class="tab-buttons">
                    <button class="tab-btn active" id="tab-checkedin" onclick="switchTab('checkedin')">✅ 僅顯示已報到</button>
                    <button class="tab-btn" id="tab-all" onclick="switchTab('all')">📋 完整報名清單</button>
                </div>
                <!-- 更新資料按鈕 -->
                <button class="btn" id="refreshBtn" onclick="refreshData()" style="padding: 8px 15px; font-size: 0.95em; background: #10b981;">🔄 更新資料</button>
            </div>
            
            <table id="participantTable">
                <thead>
                    <tr>
                        <th>狀態</th>
                        <th>姓名</th>
                        <th>單位 / 職稱</th>
                        <th>報到時間</th>
                        <th>餐券</th>
                    </tr>
                </thead>
                <tbody id="listBody">
                    <!-- JS 動態產生 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 報到結果彈窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <!-- 增加包裹層方便動畫 -->
            <div style="height: 60px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px;">
                <h2 id="modalIcon" style="margin: 0; font-size: 1.5em;">✅</h2>
            </div>
            <h2 id="modalTitle" style="color: var(--success); margin-top: 0;">報到成功</h2>
            <div id="modalMsg" style="color: #64748b; font-weight: bold;"></div>
            
            <div class="modal-info">
                <div style="font-size: 1.4em; font-weight: bold; color: var(--primary); border-bottom: 1px solid #cbd5e1; padding-bottom: 10px; margin-bottom: 10px;" id="modalName">王小明</div>
                <strong>單位：</strong><span id="modalOrg">中央氣象署</span><br>
                <strong>職稱：</strong><span id="modalTitleText">技正</span>
            </div>
            
            <button class="btn btn-large" id="modalBtn" onclick="closeModal()">確認發放餐券並關閉</button>
        </div>
    </div>

    <!-- 手動核對電話專用彈窗 -->
    <div class="modal-overlay" id="manualModal">
        <div class="modal-box">
            <h2 style="color: var(--primary); font-size: 1.8em;">手動報到核對</h2>
            <p>請核對 <strong id="manualTargetName" style="font-size: 1.2em; color: var(--warning);"></strong> 的資料</p>
            
            <div style="text-align: left; background: #f1f5f9; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <p style="margin: 0 0 10px 0; color: #334155; font-weight: bold;">請對方念出聯絡電話：</p>
                <input type="tel" id="manualPhoneInput" style="width: 100%; padding: 12px; font-size: 1.2em; border: 2px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-align: center; letter-spacing: 2px;" placeholder="請輸入完整電話 或 後 3 碼">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="background: #64748b; flex: 1;" onclick="closeManualModal()">取消</button>
                <button class="btn" style="flex: 2;" onclick="verifyManualPhone()">確認報到</button>
            </div>
        </div>
    </div>

    <script>
        // 🚨 請確認這裡是否為您最新部署的 GAS 網址
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwyFs9I2P3Wr03ui3zDcgB1HPeanB6DTJhe4zoQkO1fORHjwsefQ049jSC650kVu8Q7/exec'; 
        
        let participantList = [];
        let passcode = '';
        let isProcessing = false;
        let html5QrCode = null;
        let currentTab = 'checkedin'; 
        
        // 💡 紀錄剛報到成功的學員 ID，用於關閉彈窗後觸發閃爍特效
        let pendingFlashId = null;

        let manualTargetId = '';
        let manualTargetPhone = '';

        // --- 1. 自動登入與 Session ---
        window.onload = function() {
            const savedPass = localStorage.getItem('eew_kiosk_pass');
            const savedTime = localStorage.getItem('eew_kiosk_time'); 
            
            if (savedPass && savedTime) {
                const now = new Date().getTime();
                if (now - parseInt(savedTime) < 3600000) {
                    document.getElementById('passcodeInput').value = savedPass;
                    login();
                } else {
                    logout(); 
                }
            }
        };

        function logout() {
            localStorage.removeItem('eew_kiosk_pass');
            localStorage.removeItem('eew_kiosk_time');
            location.reload();
        }

        document.getElementById('passcodeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });

        function login() {
            const input = document.getElementById('passcodeInput').value;
            if (!input) return;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = '驗證並下載名單中...';
            
            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getKioskList', pass: input }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json()).then(res => {
                if (res.status === 'success') {
                    passcode = input;
                    participantList = res.list;
                    
                    localStorage.setItem('eew_kiosk_pass', input); 
                    localStorage.setItem('eew_kiosk_time', new Date().getTime());
                    
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    renderList();
                    maintainGunFocus(); 
                } else {
                    alert(res.message);
                    localStorage.removeItem('eew_kiosk_pass'); 
                    localStorage.removeItem('eew_kiosk_time');
                    btn.disabled = false; btn.textContent = '解鎖進入';
                    document.getElementById('passcodeInput').value = '';
                }
            }).catch(err => {
                alert('網路異常，請重試！');
                btn.disabled = false; btn.textContent = '解鎖進入';
            });
        }

        // --- 1-1. 手動更新資料 ---
        function refreshData() {
            if (!passcode) return;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '🔄 更新中...';

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getKioskList', pass: passcode }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json()).then(res => {
                if (res.status === 'success') {
                    participantList = res.list;
                    renderList(document.getElementById('searchInput').value.trim());
                    btn.textContent = '✅ 已更新';
                } else {
                    alert(res.message);
                    btn.textContent = '❌ 更新失敗';
                }
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '🔄 更新資料';
                    gunInput.focus();
                }, 1500);
            }).catch(err => {
                alert('網路異常，無法更新資料！');
                btn.disabled = false;
                btn.textContent = '🔄 更新資料';
            });
        }

        // --- 2. 掃描槍邏輯 ---
        const gunInput = document.getElementById('gunInput');
        const gunStatus = document.getElementById('gunStatus');

        function maintainGunFocus() {
            gunInput.focus();
            document.addEventListener('click', (e) => {
                const isSearching = e.target.id === 'searchInput' || e.target.id === 'manualPhoneInput';
                const isModalOpen = document.getElementById('resultModal').style.display.includes('flex') || document.getElementById('manualModal').style.display.includes('flex');
                if (!isSearching && !isModalOpen && e.target.id !== 'refreshBtn') {
                    gunInput.focus();
                }
            });
        }

        gunInput.addEventListener('blur', () => {
            gunStatus.className = 'scanner-status status-wait';
            gunStatus.textContent = '🔴 掃描槍：未就緒 (請點擊畫面)';
        });
        gunInput.addEventListener('focus', () => {
            gunStatus.className = 'scanner-status status-ready';
            gunStatus.textContent = '🟢 實體掃描槍：已就緒';
        });

        gunInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const qrId = this.value.trim();
                this.value = ''; 
                if (qrId) processCheckin(qrId);
            }
        });

        // --- 3. 手機相機 ---
        function startCamera() {
            document.getElementById('cameraBtn').style.display = 'none';
            document.getElementById('stopCameraBtn').style.display = 'block';
            document.getElementById('reader').style.display = 'block';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    if(!isProcessing) {
                        processCheckin(decodedText);
                    }
                },
                (errorMessage) => { }
            ).catch((err) => {
                alert("無法啟動相機！請確認您的瀏覽器允許存取相機權限。");
                stopCamera();
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('cameraBtn').style.display = 'block';
                    document.getElementById('stopCameraBtn').style.display = 'none';
                    document.getElementById('reader').style.display = 'none';
                }).catch(err => {});
            }
        }

        // --- 4. 處理報到 ---
        function processCheckin(qrId) {
            if (isProcessing) return;
            isProcessing = true; 
            
            showModal('🔄', '處理中...', `正在驗證...`, '...', '...', '...', '#64748b', 'normal');
            document.getElementById('modalBtn').style.display = 'none';

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'kioskCheckin', pass: passcode, id: qrId }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(res => res.json()).then(res => {
                
                document.getElementById('modalBtn').style.display = 'block';
                
                if (res.status === 'success') {
                    playSound('success');
                    pendingFlashId = res.id; // 💡 記住這個 ID 準備閃爍
                    showModal('✅', '報到成功', '', res.name, res.org, res.title, 'var(--success)', 'success');
                    updateLocalList(res.id, '已報到', res.time, res.meal);
                } else if (res.status === 'warning') {
                    playSound('error');
                    // 💡 加入 'warning' 參數觸發紅色特效
                    showModal('⚠️', '重複報到', res.message, res.name, res.org, res.title, 'var(--danger)', 'warning');
                } else {
                    playSound('error');
                    showModal('❌', '錯誤', res.message, '未知人員', '無', '無', 'var(--danger)', 'error');
                }
            }).catch(err => {
                playSound('error');
                showModal('❌', '連線失敗', '請確認網路狀態後再試', '-', '-', '-', 'var(--danger)', 'error');
                document.getElementById('modalBtn').style.display = 'block';
            });
        }

        // 💡 更新：加入 type 參數控制彈窗外觀 (閃爍警告與按鈕顏色)
        function showModal(icon, title, msg, name, org, titleText, color, type) {
            const modalIcon = document.getElementById('modalIcon');
            const modalBtn = document.getElementById('modalBtn');
            
            modalIcon.textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalTitle').style.color = color;
            document.getElementById('modalMsg').textContent = msg;
            document.getElementById('modalName').textContent = name;
            document.getElementById('modalOrg').textContent = org;
            document.getElementById('modalTitleText').textContent = titleText;
            
            if (type === 'warning' || type === 'error') {
                modalIcon.classList.add('icon-warning-blink'); // ⚠️圖示閃爍
                modalBtn.className = 'btn btn-large btn-danger-modal'; // 按鈕變紅
                modalBtn.textContent = '關閉 / 返回掃描';
            } else {
                modalIcon.classList.remove('icon-warning-blink');
                modalBtn.className = 'btn btn-large btn-primary-modal'; // 按鈕變藍
                if (type === 'success') {
                    modalBtn.textContent = '確認發放餐券並關閉';
                }
            }

            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
            isProcessing = false; 
            gunInput.focus();

            // 💡 關閉彈窗時，觸發剛報到成功者的閃爍動畫
            if (pendingFlashId) {
                // 找到該列並加入動畫 class
                const targetRow = document.querySelector(`tr[data-id="${pendingFlashId}"]`);
                if (targetRow) {
                    targetRow.classList.remove('flash-row');
                    void targetRow.offsetWidth; // 強制重繪
                    targetRow.classList.add('flash-row');
                }
                pendingFlashId = null;
            }
        }

        // --- 5. 手動報到 ---
        function promptManualCheckin(id) {
            const person = participantList.find(p => p.id === id);
            if (!person) return;
            manualTargetId = person.id;
            manualTargetPhone = person.phone.replace(/\D/g, ''); 
            
            document.getElementById('manualTargetName').textContent = person.name;
            const phoneInput = document.getElementById('manualPhoneInput');
            phoneInput.value = '';
            
            document.getElementById('manualModal').style.display = 'flex';
            setTimeout(() => phoneInput.focus(), 100);
        }
        
        function closeManualModal() {
            document.getElementById('manualModal').style.display = 'none';
            gunInput.focus();
        }
        
        document.getElementById('manualPhoneInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyManualPhone();
        });

        function verifyManualPhone() {
            const inputPhone = document.getElementById('manualPhoneInput').value.replace(/\D/g, '');
            if (!inputPhone) {
                alert('請輸入電話號碼！');
                return;
            }
            if (manualTargetPhone === inputPhone || (inputPhone.length >= 3 && manualTargetPhone.endsWith(inputPhone))) {
                closeManualModal();
                processCheckin(manualTargetId); 
            } else {
                alert('❌ 電話號碼核對失敗，請重新確認！');
            }
        }

        function maskPhone(phone) {
            if (!phone || phone.length < 4) return phone;
            if (phone.length === 10) return phone.substring(0, 4) + '***' + phone.substring(7);
            return phone.substring(0, phone.length - 3) + '***';
        }

        // --- 6. 名單渲染 ---
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-checkedin').className = tab === 'checkedin' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-all').className = tab === 'all' ? 'tab-btn active' : 'tab-btn';
            renderList();
        }

        function updateLocalList(id, status, time, meal) {
            const person = participantList.find(p => p.id === id || p.id === id.replace("EEW-", ""));
            if (person) {
                person.status = status;
                person.time = time;
                person.meal = meal;
                renderList(document.getElementById('searchInput').value.trim());
            }
        }

        function renderList(filterText = '') {
            const tbody = document.getElementById('listBody');
            tbody.innerHTML = '';
            
            let checkedIn = 0;
            
            // 💡 確保時間排序正確 (localeCompare 會把晚的時間排在前面，達成置頂效果)
            const sortedList = [...participantList].sort((a, b) => {
                if(a.status === '已報到' && b.status !== '已報到') return -1;
                if(a.status !== '已報到' && b.status === '已報到') return 1;
                if(a.time && b.time) return b.time.localeCompare(a.time); 
                return 0;
            });

            sortedList.forEach(p => {
                if (p.status === '已報到') checkedIn++;
                if (currentTab === 'checkedin' && p.status !== '已報到') return;

                if (filterText && !p.name.includes(filterText) && !p.phone.includes(filterText)) return;

                const statusHtml = p.status === '已報到' 
                    ? `<span class="badge-success">✅ 已報到</span>` 
                    : `<button class="btn-checkin-manual" onclick="promptManualCheckin('${p.id}')">手動報到</button>`;
                
                const mealActive = p.meal === '已發放' ? 'meal-active' : '';
                const mealHtml = p.status === '已報到'
                    ? `<button class="meal-toggle ${mealActive}" onclick="toggleMeal('${p.id}', this)">${p.meal || '未領取'}</button>`
                    : `<span style="color:#cbd5e1;">-</span>`;

                const tr = document.createElement('tr');
                // 💡 賦予 ID 屬性，供閃爍動畫抓取
                tr.setAttribute('data-id', p.id); 
                tr.innerHTML = `
                    <td>${statusHtml}</td>
                    <td><strong style="color:var(--primary);">${p.name}</strong><br><span style="font-size:0.8em;color:#64748b;">${maskPhone(p.phone)}</span></td>
                    <td>${p.org}<br><span style="font-size:0.9em;color:#64748b;">${p.title}</span></td>
                    <td style="color:#64748b;">${p.time || '-'}</td>
                    <td>${mealHtml}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalCount').textContent = participantList.length;
            document.getElementById('checkinCount').textContent = checkedIn;
        }

        function filterList() {
            const text = document.getElementById('searchInput').value.trim();
            renderList(text);
        }

        function toggleMeal(qrId, btnElement) {
            const currentStatus = btnElement.textContent;
            const newStatus = currentStatus === '已發放' ? '未領取' : '已發放';
            
            btnElement.textContent = '更新中...';
            btnElement.disabled = true;

            fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'toggleMeal', pass: passcode, id: qrId, mealStatus: newStatus }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(() => {
                updateLocalList(qrId, '已報到', participantList.find(p=>p.id===qrId).time, newStatus);
            });
        }

        // 音效產生器
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'success') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.5);
            }
        }
    </script>
</body>
</html>
